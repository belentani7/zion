name: Audit

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Build · Lint · Tests · Presupuestos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Typecheck (tsc --noEmit sobre src, server, api, e2e y configs)
        run: npm run typecheck

      - name: Build de producción
        run: npm run build

      - name: Tests unitarios y de componentes
        run: npm test

      - name: Cobertura
        run: npm run test:coverage

      - name: Presupuestos de rendimiento
        run: npm run perf

      - name: Paridad i18n (pt/es/en/ca)
        run: npm run check:i18n

      - name: Auditoría de producción (30 criterios)
        run: npm run audit

      - name: Resumen de métricas
        if: always()
        run: |
          {
            echo '## Métricas del build'
            echo '```'
            node scripts/perf-report.mjs --no-fail || true
            echo '```'
            echo '## Auditoría de producción'
            echo '```'
            node scripts/audit-production-readiness.mjs --quiet || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-and-coverage
          path: |
            dist/
            coverage/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: E2E (Playwright · Chromium)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Suite E2E sobre el build de producción
        run: npx playwright test --project=chromium

      - name: Informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sin ficheros de credenciales trackeados
        run: |
          fail=0
          tracked=$(git ls-files)
          for pattern in '\.env$' '\.env\.[a-z]+$' '\.pem$' '\.p12$' '\.pfx$' 'id_rsa$' 'id_ed25519$' '\.keystore$' '\.npmrc$' '\.netrc$'; do
            hits=$(echo "$tracked" | grep -E "$pattern" || true)
            if [ -n "$hits" ]; then
              echo "::error file=.env::Fichero sensible trackeado ($pattern):"
              echo "$hits"
              fail=1
            fi
          done
          if echo "$tracked" | grep -qE '(^|/)\.env\.example$'; then
            echo "Plantilla .env.example presente (correcto)."
          fi
          exit $fail

      - name: Sin artefactos de build versionados
        run: |
          if git ls-files | grep -qE '^dist/'; then
            echo "::error::dist/ está versionado: es salida de build, no fuente."
            exit 1
          fi
          echo "dist/ fuera del registro (correcto)."

      - name: Sin patrones de credenciales
        run: |
          fail=0
          if git ls-files -z \
            | xargs -0 -r grep -IEn \
                '(sk-ant-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|GOCSPX-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            2>/dev/null; then
            echo "::error::Se han encontrado patrones de credenciales. Revisa y rota lo que corresponda."
            fail=1
          fi
          exit $fail

      - name: Sin placeholders ni TODO en el código entregado
        run: |
          fail=0
          if git ls-files -z -- 'src' 'server.ts' 'api' 'scripts' 'e2e' \
            | xargs -0 -r grep -nE '(TODO|FIXME|XXX|HACK|placeholder)\b' 2>/dev/null \
            | grep -vE '\.test\.|placeholder=|sddAuditPlaceholder|aria-placeholder'; then
            echo "::error::Marcadores de trabajo pendiente en el código entregado."
            fail=1
          fi
          exit $fail

      - name: JSON valido
        run: |
          warn=0
          for f in $(git ls-files '*.json' | grep -v 'package-lock.json' | head -100); do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" 2>/dev/null; then
              echo "::warning file=$f::JSON no parseable"
              warn=1
            fi
          done
          if [ "$warn" = 1 ]; then echo "Hay JSON que no parsea. Revisar si es intencionado."; fi
          exit 0

      - name: HTML basico
        run: |
          warn=0
          for f in $(git ls-files '*.html' | head -60); do
            [ -s "$f" ] || continue
            if grep -qi '<html' "$f"; then
              grep -qi '<title' "$f" || { echo "::warning file=$f::Documento HTML sin <title>"; warn=1; }
              grep -qi '<meta[^>]*name=["'"'"']description' "$f" || { echo "::warning file=$f::Documento HTML sin meta description"; warn=1; }
            fi
          done
          if [ "$warn" = 1 ]; then echo "Revisar avisos de SEO en los HTML."; fi
          exit 0

      - name: Resumen
        run: echo "Audit ejecutado sobre $(git ls-files | wc -l) ficheros."
