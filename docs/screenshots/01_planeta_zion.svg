<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d0417"/>
      <stop offset="50%" stop-color="#05010a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="zionCore" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="25%" stop-color="#fdcb6e"/>
      <stop offset="55%" stop-color="#d63031"/>
      <stop offset="85%" stop-color="#6c1a2c"/>
      <stop offset="100%" stop-color="#090105"/>
    </radialGradient>
    <linearGradient id="goldVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffb96"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#e056fd"/>
    </linearGradient>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#spaceBg)"/>
  <!-- Starfield Procedural -->
  <g opacity="0.6">
    <circle cx="95" cy="120" r="1.5" fill="#fff"/>
    <circle cx="280" cy="80" r="2.2" fill="#ffd45c"/>
    <circle cx="890" cy="140" r="1.8" fill="#e056fd"/>
    <circle cx="1060" cy="220" r="2.5" fill="#fff"/>
    <circle cx="980" cy="650" r="1.5" fill="#ffd45c"/>
    <circle cx="150" cy="690" r="1.8" fill="#fff"/>
    <circle cx="450" cy="740" r="1.2" fill="#e056fd"/>
  </g>
  <!-- Planeta Bioeléctrico Zion (Atmósfera, Fresnel & Grietas Kintsugi) -->
  <circle cx="600" cy="380" r="205" fill="none" stroke="#d4af37" stroke-width="6" opacity="0.3" filter="url(#bloom)"/>
  <circle cx="600" cy="380" r="185" fill="url(#zionCore)" filter="url(#bloom)"/>
  <!-- Vetas Bioeléctricas Resonantes -->
  <path d="M 460 320 Q 530 360 580 320 T 700 410 T 770 370" fill="none" stroke="url(#goldVein)" stroke-width="4.5" filter="url(#bloom)"/>
  <path d="M 480 440 Q 550 420 620 460 T 720 440" fill="none" stroke="url(#goldVein)" stroke-width="3.5" filter="url(#bloom)"/>
  <!-- Anillos Orbitales de Acreción -->
  <ellipse cx="600" cy="380" rx="360" ry="75" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.8" transform="rotate(-15 600 380)" filter="url(#bloom)"/>
  <ellipse cx="600" cy="380" rx="390" ry="82" fill="none" stroke="#e056fd" stroke-width="1.5" opacity="0.5" transform="rotate(-15 600 380)"/>
  <!-- Inscripción del Archivo Fotográfico -->
  <text x="600" y="690" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#d4af37" letter-spacing="5">REGISTRO FOTOGRÁFICO #01 · PLANETA ZION</text>
  <text x="600" y="725" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#a4b0be" letter-spacing="3">NÚCLEO BIOELÉCTRICO · SOLFEGGIO 432 HZ · KINTSUGI DORADO</text>
  <text x="600" y="750" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#718093" letter-spacing="2">BELENTANI OMEGA ARCHIVE · HOSPITALET - SÃO PAULO</text>
</svg>